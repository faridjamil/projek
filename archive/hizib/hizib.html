<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NWDI Farid Jamil App</title>
<style>/* === Reset dasar === */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

/* === Tampilan umum === */
body {
  background: linear-gradient(135deg, #e0f7fa, #fff9c4);
  color: #333;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* === Header === */
header {
  text-align: center;
  background: linear-gradient(135deg, #00bfa5, #1de9b6);
  color: white;
  padding: 1rem;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

header img {
  width: 80px;
  margin-bottom: 0.5rem;
  animation: bounce 2s infinite ease-in-out;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

header h1 {
  font-size: 1.3rem;
  letter-spacing: 1px;
}

/* === Menu Grid === */
.container {
  flex: 1;
  padding: 1rem;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  margin-top: 1rem;
}

.menu-item {
  background: white;
  border-radius: 16px;
  text-align: center;
  padding: 1rem;
  transition: all 0.3s ease;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
  cursor: pointer;
}

.post-item {
  background: white;
  border-radius: 16px;
  text-align: center;
  padding: 1rem;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
}

.menu-item:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
  background: linear-gradient(135deg, #f5f5f5, #e0f2f1);
}

.menu-item img {
  width: 60px;
  height: 60px;
  object-fit: contain;
  margin-bottom: 0.5rem;
}

.menu-item p {
  font-size: 0.9rem;
  color: #333;
  font-weight: 600;
}

/* === Transisi Halaman === */
.page-transition {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  z-index: 9999;
  transform: translateY(100%);
  transition: transform 0.6s ease-in-out;
}

.page-transition.active {
  transform: translateY(0);
}

.page-transition.exit {
  transform: translateY(-100%);
}

/* === Efek Loading Bulat === */
.loader {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 5px solid #e0f2f1;
  border-top: 5px solid #00bfa5;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: translate(-50%, -50%) rotate(0deg); }
  100% { transform: translate(-50%, -50%) rotate(360deg); }
}

/* === Footer === */
footer {
  text-align: center;
  background: linear-gradient(135deg, #1de9b6, #00bfa5);
  color: white;
  padding: 0.8rem;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  font-size: 0.85rem;
  box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.1);
  position: sticky;
  bottom: 0;
}

/* === Efek Interaktif Mobile === */
.menu-item:active {
  transform: scale(0.97);
  opacity: 0.9;
}

/* === Responsif === */
@media (min-width: 600px) {
  .menu-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (min-width: 900px) {
  .menu-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}</style>
  <link rel="icon" href="icons/logo.png" type="image/x-icon">
</head>
<body>
  <header>
    <img src="icons/logo.png" width=10% />
    <br>
    <h1>NWDI Farid Jamil App</h1>
  </header>

  <main>
    <div class="container">
      <section class="post-grid">
        <!-- Menu Items -->
        <div class="menu-item" onclick="openMenu('index')">
          <!-- <img src="icons/hizib.png" alt="Beranda" /> -->
          <p>Beranda</p>
        </div>
        <br>
        <div class="post-item">
            <img src="icons/hizib.png" alt="Hizib" />
            <br><br><br><p>Hizib Nahdlatul Wathan</p><br><br><br>
            <iframe name="Hizib" src="../Hizib%20NW%20Offline/index.html" width="100%" height="700px"></iframe>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 NWDI Farid Jamil App | Dirancang oleh Farid Jamil Official</p>
  </footer>

  <script>
  function openMenu(menuName) {
  // Bikin animasi transisi
  const transition = document.createElement('div');
  transition.classList.add('page-transition');
  transition.innerHTML = '<div class="loader"></div>';
  document.body.appendChild(transition);

  // Jalankan animasi masuk
  setTimeout(() => transition.classList.add('active'), 10);

  // Simulasi pindah halaman
  setTimeout(() => {
    transition.classList.remove('active');
    transition.classList.add('exit');

    // Setelah animasi keluar, hapus layer-nya
    setTimeout(() => transition.remove(), 600);

    // Redirect halaman
    window.location.href = menuName + ".html";
  }, 1200);
}
  </script>
</body>
</html>
